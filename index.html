<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Kebun Angka — Belajar Berhitung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --sky-top:#BFE9FF;
    --sky-bottom:#EAF9FF;
    --sun:#FFC93C;
    --sun-dark:#E8A317;
    --leaf:#4CAF7D;
    --leaf-dark:#379563;
    --coral:#FF6B5B;
    --coral-dark:#E14C3C;
    --berry:#8B6FCB;
    --berry-dark:#6F52AE;
    --ink:#2B3A55;
    --ink-soft:#5A6B8C;
    --card:#FFFFFF;
    --line:#DCEBF5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 45%, #F3FFF6 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    padding:20px 18px 40px;
    display:flex;
    flex-direction:column;
  }
  h1,h2,h3{font-family:'Baloo 2',sans-serif; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  button:focus-visible, input:focus-visible{
    outline:3px solid var(--berry);
    outline-offset:2px;
  }

  .brand{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .brand .mascot{font-size:34px; line-height:1;}
  .brand h1{font-size:26px; color:var(--leaf-dark); letter-spacing:.3px;}
  .brand .stars{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    background:var(--card); border:2px solid var(--sun); border-radius:999px;
    padding:6px 12px; font-weight:800; font-size:14px; color:var(--sun-dark);
    box-shadow:0 2px 0 var(--line); white-space:nowrap;
  }
  .subtitle{color:var(--ink-soft); font-size:15px; margin-bottom:22px; font-weight:600;}

  .card{
    background:var(--card); border-radius:26px; padding:22px;
    box-shadow:0 6px 0 var(--line), 0 10px 24px rgba(43,58,85,0.08);
  }

  .op-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0;}
  .op-card{
    border:none; border-radius:20px; padding:18px 12px; text-align:left; color:#fff;
    font-family:'Baloo 2',sans-serif; font-size:17px; position:relative;
    box-shadow:0 5px 0 rgba(0,0,0,0.14); transition:transform .12s ease;
  }
  .op-card:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.14);}
  .op-card .sym{display:block; font-size:30px; margin-bottom:6px;}
  .op-card.tambah{background:var(--leaf);}
  .op-card.kurang{background:var(--coral);}
  .op-card.kali{background:var(--berry);}
  .op-card.bagi{background:var(--sun-dark);}
  .op-card.campur{grid-column:1 / -1; background:linear-gradient(90deg,var(--leaf),var(--sun-dark),var(--coral),var(--berry));}
  .op-card.selected{outline:4px solid var(--ink); outline-offset:2px;}

  .start-btn{
    width:100%; margin-top:8px; padding:16px; border:none; border-radius:18px;
    background:var(--ink); color:#fff; font-family:'Baloo 2',sans-serif; font-size:19px;
    font-weight:700; box-shadow:0 5px 0 #16233d;
  }
  .start-btn:disabled{background:#B7C0D1; box-shadow:0 5px 0 #9aa5ba; cursor:not-allowed;}
  .start-btn:not(:disabled):active{transform:translateY(3px); box-shadow:0 2px 0 #16233d;}

  .hint{font-size:13.5px; color:var(--ink-soft); text-align:center; margin-top:10px; font-weight:600;}

  .trail{display:flex; gap:6px; justify-content:center; margin-bottom:18px;}
  .trail span{font-size:20px; opacity:.35; filter:grayscale(1); transition:all .25s ease;}
  .trail span.done{opacity:1; filter:none; transform:scale(1.15);}

  .quiz-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .quiz-top .back{background:none; border:none; color:var(--ink-soft); font-weight:800; font-size:14px; padding:6px;}
  .quiz-top .qnum{font-weight:800; color:var(--ink-soft); font-size:14px;}

  .question-text{font-family:'Baloo 2',sans-serif; font-size:34px; text-align:center; color:var(--ink); margin:6px 0 18px;}

  .visual-box{
    background:#F6FBFF; border:2px dashed var(--line); border-radius:18px; padding:16px;
    margin-bottom:18px; min-height:70px; display:flex; align-items:center; justify-content:center;
  }
  .icon-groups{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;}
  .icon-grid{display:flex; flex-wrap:wrap; gap:5px; max-width:220px; justify-content:center;}
  .icon-grid .ic{font-size:24px; line-height:1;}
  .icon-grid .ic.taken{opacity:.25; filter:grayscale(1);}
  .op-symbol{font-family:'Baloo 2',sans-serif; font-size:26px; color:var(--ink-soft);}
  .group-box{border:2.5px dashed var(--berry); border-radius:14px; padding:8px; display:flex; flex-wrap:wrap; gap:4px; max-width:90px; justify-content:center;}
  .group-box .ic{font-size:18px;}
  .compact-visual{text-align:center; font-weight:700; color:var(--ink-soft); font-size:14px; line-height:1.5;}
  .compact-visual .big{font-family:'Baloo 2',sans-serif; font-size:30px; color:var(--berry-dark); display:block;}

  .answer-row{display:flex; gap:10px; margin-bottom:14px;}
  .answer-row input{
    flex:1; font-family:'Baloo 2',sans-serif; font-size:26px; text-align:center; padding:14px;
    border-radius:16px; border:3px solid var(--line); color:var(--ink); background:#fff;
  }
  .answer-row input.wrong-shake{border-color:var(--coral); animation:shake .35s;}
  .answer-row input.right-glow{border-color:var(--leaf);}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}

  .check-btn{
    width:100%; padding:15px; border:none; border-radius:16px; background:var(--berry); color:#fff;
    font-family:'Baloo 2',sans-serif; font-size:18px; box-shadow:0 5px 0 var(--berry-dark);
  }
  .check-btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--berry-dark);}
  .check-btn.next{background:var(--leaf); box-shadow:0 5px 0 var(--leaf-dark);}
  .check-btn:disabled{background:#B7C0D1; box-shadow:0 5px 0 #9aa5ba;}

  .feedback{
    margin-top:14px; align-items:center; gap:10px; padding:12px 14px; border-radius:16px;
    font-weight:800; font-size:15px; display:none;
  }
  .feedback.show{display:flex;}
  .feedback.correct{background:#E7F7EE; color:var(--leaf-dark);}
  .feedback.incorrect{background:#FFEDEB; color:var(--coral-dark);}
  .feedback .face{font-size:26px;}

  .result-emoji{font-size:60px; text-align:center; margin-bottom:6px;}
  .result-title{font-family:'Baloo 2',sans-serif; font-size:24px; text-align:center; margin-bottom:4px;}
  .result-sub{text-align:center; color:var(--ink-soft); font-weight:700; margin-bottom:20px;}
  .result-score{font-family:'Baloo 2',sans-serif; font-size:44px; text-align:center; color:var(--berry-dark); margin-bottom:4px;}
  .result-stars{text-align:center; font-size:22px; margin-bottom:22px;}
  .result-actions{display:flex; flex-direction:column; gap:10px;}

  .loading-line{text-align:center; color:var(--ink-soft); font-weight:700; padding:20px 0;}

  @media (max-width:360px){
    .question-text{font-size:28px;}
    .op-card{font-size:15px; padding:14px 10px;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------------- Supabase ---------------- */
let sb = null;
try{
  if(typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL.indexOf('GANTI-DENGAN') === -1){
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
}catch(e){ console.warn('Supabase belum dikonfigurasi, pakai soal otomatis aja.', e); }

/* ---------------- State ---------------- */
const STORAGE_KEY = 'kebunAngka_totalStars';
let totalStars = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);

let state = {
  screen: 'home',
  chosenOp: null,
  questions: [],
  idx: 0,
  correctCount: 0,
  answered: false,
  slotResults: [],
  loading: false
};

const OP_LABELS = {
  tambah: {label:'Tambah', symbol:'+'},
  kurang: {label:'Kurang', symbol:'−'},
  kali:   {label:'Kali',   symbol:'×'},
  bagi:   {label:'Bagi',   symbol:'÷'}
};

const ENCOURAGE_RIGHT = ['Wah pinter banget!', 'Betul sekali!', 'Keren, lanjut lagi!', 'Mantap!', 'Tepat sekali!'];
const ENCOURAGE_WRONG = ['Yuk coba lagi ya!', 'Hampir benar, semangat!', 'Gak apa-apa, kita belajar lagi!', 'Ayo dihitung pelan-pelan!'];

function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------------- Question generation (procedural) ---------------- */
function generateQuestion(op){
  if(op === 'campur') op = pick(['tambah','kurang','kali','bagi']);
  let a,b,answer;
  if(op === 'tambah'){ a=rand(1,10); b=rand(1,10); answer=a+b; }
  else if(op === 'kurang'){ a=rand(5,20); b=rand(1,a); answer=a-b; }
  else if(op === 'kali'){ a=rand(2,9); b=rand(2,9); answer=a*b; }
  else { b=rand(2,9); const q=rand(2,9); a=b*q; answer=q; }
  return { op, a, b, answer, isCustom:false };
}

/* ---------------- Question fetching (custom, from Supabase) ---------------- */
async function fetchCustomQuestions(chosenOp){
  if(!sb) return [];
  try{
    let query = sb.from('custom_questions').select('*').eq('is_active', true);
    if(chosenOp !== 'campur') query = query.eq('operation', chosenOp);
    const { data, error } = await query;
    if(error){ console.warn('Gagal ambil soal custom:', error.message); return []; }
    return (data || []).map(row => ({
      op: row.operation,
      isCustom: true,
      text: row.question_text,
      answer: Number(row.answer),
      note: row.note || ''
    }));
  }catch(e){
    console.warn('Gagal ambil soal custom:', e);
    return [];
  }
}

async function generateRound(chosenOp){
  const custom = shuffle(await fetchCustomQuestions(chosenOp));

  // Soal dari dashboard admin selalu diprioritaskan & selalu muncul.
  if(custom.length >= 10){
    return custom.slice(0,10);
  }

  // Kalau soal admin belum cukup 10, sisanya ditambal soal otomatis.
  let round = custom.slice();
  while(round.length < 10) round.push(generateQuestion(chosenOp));
  return shuffle(round);
}

/* ---------------- Visual renderers ---------------- */
function iconRow(count, extraClass){
  let out = '';
  for(let i=0;i<count;i++) out += `<span class="ic ${extraClass||''}">🍎</span>`;
  return out;
}

function renderVisual(q){
  if(q.isCustom){
    if(q.note){
      return `<div class="compact-visual">${escapeHtml(q.note)}</div>`;
    }
    return `<div class="compact-visual"><span class="big">✨</span>Soal spesial dari kakak!</div>`;
  }
  const {op,a,b} = q;
  if(op === 'tambah'){
    return `<div class="icon-groups">
      <div class="icon-grid">${iconRow(a)}</div>
      <span class="op-symbol">+</span>
      <div class="icon-grid">${iconRow(b)}</div>
    </div>`;
  }
  if(op === 'kurang'){
    let icons = '';
    for(let i=0;i<a;i++) icons += `<span class="ic ${i >= a-b ? 'taken':''}">🍎</span>`;
    return `<div><div class="icon-grid" style="max-width:260px;">${icons}</div>
      <div class="compact-visual" style="margin-top:8px;">${b} buah diambil</div></div>`;
  }
  if(op === 'kali'){
    const total = a*b;
    if(total <= 30){
      let groups = '';
      for(let i=0;i<b;i++) groups += `<div class="group-box">${iconRow(a)}</div>`;
      return `<div class="icon-groups">${groups}</div>`;
    }
    return `<div class="compact-visual"><span class="big">${b} kelompok</span>berisi ${a} buah di tiap kelompok</div>`;
  }
  if(op === 'bagi'){
    const dividend = a, groupsCount = b, perGroup = q.answer;
    if(dividend <= 30){
      let groups = '';
      for(let i=0;i<groupsCount;i++) groups += `<div class="group-box">${iconRow(perGroup)}</div>`;
      return `<div class="icon-groups">${groups}</div>`;
    }
    return `<div class="compact-visual"><span class="big">${dividend} buah</span>dibagi rata ke ${groupsCount} kelompok</div>`;
  }
  return '';
}

function questionText(q){
  if(q.isCustom) return q.text;
  const s = OP_LABELS[q.op].symbol;
  return `${q.a} ${s} ${q.b} = ?`;
}

/* ---------------- Screens ---------------- */
function render(){
  const app = document.getElementById('app');
  if(state.screen === 'home') app.innerHTML = homeScreen();
  else if(state.screen === 'quiz') app.innerHTML = quizScreen();
  else app.innerHTML = resultScreen();
  attachHandlers();
}

function homeScreen(){
  return `
    <div class="brand"><span class="mascot">🐰</span><h1>Kebun Angka</h1><div class="stars">⭐ ${totalStars}</div></div>
    <div class="subtitle">Ayo berhitung sambil main di kebun buah!</div>
    <div class="card">
      <h2 style="font-size:18px; color:var(--ink-soft);">Pilih materi</h2>
      <div class="op-grid">
        <button class="op-card tambah" data-op="tambah"><span class="sym">➕</span>Tambah</button>
        <button class="op-card kurang" data-op="kurang"><span class="sym">➖</span>Kurang</button>
        <button class="op-card kali" data-op="kali"><span class="sym">✖️</span>Kali</button>
        <button class="op-card bagi" data-op="bagi"><span class="sym">➗</span>Bagi</button>
        <button class="op-card campur" data-op="campur"><span class="sym">🌈</span>Campur Semua</button>
      </div>
      <button class="start-btn" id="startBtn" disabled>Mulai Berpetualang</button>
      <div class="hint" id="homeHint">Pilih salah satu dulu ya, baru bisa mulai 🌻</div>
    </div>
  `;
}

function quizScreen(){
  if(state.loading){
    return `
      <div class="brand"><span class="mascot">🐰</span><h1 style="font-size:20px;">Kebun Angka</h1><div class="stars">⭐ ${totalStars}</div></div>
      <div class="card"><div class="loading-line">Menyiapkan soal... 🌱</div></div>
    `;
  }
  const q = state.questions[state.idx];
  const trail = state.slotResults.map((r,i) => {
    if(i > state.idx) return '<span>🌱</span>';
    if(r === true) return '<span class="done">🌸</span>';
    if(r === false) return '<span class="done">🍂</span>';
    return '<span>🌱</span>';
  }).join('');

  return `
    <div class="brand"><span class="mascot">🐰</span><h1 style="font-size:20px;">Kebun Angka</h1><div class="stars">⭐ ${totalStars}</div></div>
    <div class="trail">${trail}</div>
    <div class="card">
      <div class="quiz-top">
        <button class="back" id="backBtn">← Kembali</button>
        <span class="qnum">Soal ${state.idx+1} / 10</span>
      </div>
      <div class="question-text">${questionText(q)}</div>
      <div class="visual-box">${renderVisual(q)}</div>
      <div class="answer-row">
        <input type="number" inputmode="numeric" id="answerInput" placeholder="Jawabanmu" autocomplete="off" ${state.answered?'disabled':''}>
      </div>
      <button class="check-btn ${state.answered?'next':''}" id="actionBtn">${state.answered ? (state.idx===9 ? 'Lihat Hasil' : 'Soal Berikutnya') : 'Cek Jawaban'}</button>
      <div class="feedback ${state.answered ? 'show '+(state.lastCorrect?'correct':'incorrect') : ''}" id="feedbackBox">
        <span class="face">${state.lastCorrect ? '🎉' : '💪'}</span>
        <span>${state.feedbackMsg || ''}</span>
      </div>
    </div>
  `;
}

function resultScreen(){
  const score = state.correctCount;
  let emoji='🌟', title='Kerja bagus!';
  if(score === 10){ emoji='🏆'; title='Sempurna banget!'; }
  else if(score >= 7){ emoji='🌟'; title='Hebat sekali!'; }
  else if(score >= 4){ emoji='🌼'; title='Terus berlatih ya!'; }
  else { emoji='🌱'; title='Yuk coba lagi, pasti bisa!'; }

  return `
    <div class="brand"><span class="mascot">🐰</span><h1 style="font-size:20px;">Kebun Angka</h1><div class="stars">⭐ ${totalStars}</div></div>
    <div class="card">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${title}</div>
      <div class="result-sub">Materi: ${state.chosenOp === 'campur' ? 'Campur Semua' : OP_LABELS[state.chosenOp].label}</div>
      <div class="result-score">${score} / 10</div>
      <div class="result-stars">Kamu dapat ${score} ⭐ baru</div>
      <div class="result-actions">
        <button class="start-btn" id="playAgainBtn">Main Lagi</button>
        <button class="check-btn" id="homeBtn" style="background:var(--ink-soft); box-shadow:0 5px 0 #3d4a63;">Ganti Materi</button>
      </div>
    </div>
  `;
}

/* ---------------- Event handlers ---------------- */
function attachHandlers(){
  if(state.screen === 'home'){
    document.querySelectorAll('.op-card').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.op-card').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.chosenOp = btn.dataset.op;
        document.getElementById('startBtn').disabled = false;
      });
    });
    document.getElementById('startBtn').addEventListener('click', async () => {
      if(!state.chosenOp) return;
      state.screen = 'quiz';
      state.loading = true;
      state.idx = 0;
      state.correctCount = 0;
      state.answered = false;
      state.slotResults = new Array(10).fill(null);
      render();
      state.questions = await generateRound(state.chosenOp);
      state.loading = false;
      render();
    });
  }

  if(state.screen === 'quiz' && !state.loading){
    const input = document.getElementById('answerInput');
    input.focus();
    const actionBtn = document.getElementById('actionBtn');
    document.getElementById('backBtn').addEventListener('click', () => { state.screen='home'; render(); });

    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') actionBtn.click(); });

    actionBtn.addEventListener('click', () => {
      if(!state.answered){
        const val = input.value.trim();
        if(val === ''){ input.classList.add('wrong-shake'); setTimeout(()=>input.classList.remove('wrong-shake'),350); return; }
        const q = state.questions[state.idx];
        const correct = parseInt(val,10) === q.answer;
        state.answered = true;
        state.lastCorrect = correct;
        state.slotResults[state.idx] = correct;
        if(correct){
          state.correctCount++;
          totalStars++;
          localStorage.setItem(STORAGE_KEY, totalStars);
          state.feedbackMsg = pick(ENCOURAGE_RIGHT);
          input.classList.add('right-glow');
        } else {
          state.feedbackMsg = `${pick(ENCOURAGE_WRONG)} Jawaban yang benar: ${q.answer}`;
          input.classList.add('wrong-shake');
        }
        render();
      } else {
        if(state.idx === 9){ state.screen = 'result'; }
        else { state.idx++; state.answered = false; }
        render();
      }
    });
  }

  if(state.screen === 'result'){
    document.getElementById('playAgainBtn').addEventListener('click', async () => {
      state.screen = 'quiz';
      state.loading = true;
      state.idx = 0;
      state.correctCount = 0;
      state.answered = false;
      state.slotResults = new Array(10).fill(null);
      render();
      state.questions = await generateRound(state.chosenOp);
      state.loading = false;
      render();
    });
    document.getElementById('homeBtn').addEventListener('click', () => { state.chosenOp=null; state.screen='home'; render(); });
  }
}

render();
</script>
</body>
</html>
